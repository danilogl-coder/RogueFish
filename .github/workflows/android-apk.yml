# Builds an installable test APK and publishes it as the "test-apk" pre-release,
# so it can be downloaded straight to a phone:
#   https://github.com/<owner>/<repo>/releases/download/test-apk/RogueFish.apk
#
# Runs on every push that touches the game, or from the Actions tab.
# The APK is for sideload testing only; Google Play gets the AAB (android-release.yml).
# It uses a separate package and Google's sample AdMob IDs, so it can coexist
# with the Play install without touching that app's save data.
name: Android test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5"
  GODOT_RELEASE: "stable"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages (API 36)
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Godot + Android templates
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$T"
          unzip -q "Godot_v${V}_export_templates.tpz"
          mv templates/* "$T/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT

      - name: Test package version and AdMob application ID
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"test-${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"test-${GITHUB_RUN_NUMBER}\"/" project.godot
          sed -i 's/^general\/android\/app_id=.*/general\/android\/app_id="ca-app-pub-3940256099942544~3347511713"/' project.godot

      - name: Install Gradle build template
        run: |
          godot --headless --path . --import || true
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p android/build
          unzip -q -o "$T/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.${GODOT_RELEASE}" > android/.build_version
          touch android/build/.gdignore
          sed -i -E 's/(compileSdk\s*:\s*)[0-9]+/\136/' android/build/config.gradle

      # Same key on every run, so a new test APK installs over the previous one
      # (and keeps the save).
      - uses: actions/cache@v4
        with:
          path: ~/test-apk.keystore
          key: test-apk-keystore-v1

      - name: Test keystore
        run: |
          K="$HOME/test-apk.keystore"
          [ -f "$K" ] || keytool -genkeypair -keystore "$K" -storepass android -keypass android \
            -alias test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rogue Fish test"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$K" >> "$GITHUB_ENV"

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: test
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p builds
          godot --headless --path . --export-release "Android APK" builds/RogueFish.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose builds/RogueFish.apk
          ls -la builds

      - name: Publish pre-release "test-apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-apk --yes --cleanup-tag || true
          gh release create test-apk builds/RogueFish.apk --prerelease --target "$GITHUB_SHA" \
            --title "Rogue Fish - test APK" \
            --notes "Test build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install on Android: open the APK and allow installing unknown apps."
