# Builds the signed Android App Bundle (.aab) for Google Play.
#
# Run it from the Actions tab ("Run workflow") or push a tag like v1.0.1.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore / key password
#   ANDROID_KEY_ALIAS          key alias
# See docs/RELEASE.md for how to create them.
name: Android release (AAB)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (increase by 1 for every upload to Play)"
        required: true
        default: "1"
      version_name:
        description: "versionName shown to players"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.5"
  GODOT_RELEASE: "stable"

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages (API 36)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Godot + export templates
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          unzip -q "Godot_v${V}_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT

      - name: Version
        run: |
          CODE="${{ github.event.inputs.version_code }}"
          NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$CODE" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            CODE="${{ github.run_number }}"
          fi
          sed -i "s/^version\/code=.*/version\/code=${CODE}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${NAME}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${NAME}\"/" project.godot
          echo "versionCode=$CODE versionName=$NAME"

      - name: Import project and install the Gradle build template
        run: |
          godot --headless --path . --import || true
          # same as the editor's "Install Android Build Template"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p android/build
          unzip -q -o "$T/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.${GODOT_RELEASE}" > android/.build_version
          touch android/build/.gdignore
          # compile against Android 16 (API 36), the Play Store target
          sed -i -E 's/(compileSdk\s*:\s*)[0-9]+/\136/' android/build/config.gradle
          grep -n "compileSdk\|targetSdk" android/build/config.gradle

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Export AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p builds
          godot --headless --path . --export-release "Android" builds/RogueFish.aab
          ls -la builds

      - uses: actions/upload-artifact@v4
        with:
          name: RogueFish-aab
          path: builds/RogueFish.aab
          if-no-files-found: error
